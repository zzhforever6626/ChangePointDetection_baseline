[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkbu-breakpoint-detection"
version = "0.3.0"
description = "Fixed validation-selected FLOSS, RuLSIF and TSCP2 baselines"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
tscp2 = ["torch>=2.2,<3"]

[project.scripts]
run-baseline = "breakpoint_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
breakpoint_detection = ["baseline_settings.json", "reference_sources/rulsif/LICENSE", "reference_sources/tscp2/keras-tcn/LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
addopts = "--basetemp=.pytest-tmp"
